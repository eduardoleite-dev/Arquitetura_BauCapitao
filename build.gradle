plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.baudocapitao'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:3.3.5')
    api 'org.springframework:spring-context'
    api 'org.springframework:spring-web'
    api 'org.springframework.security:spring-security-core'
    api 'org.springframework.security:spring-security-web'
    api 'org.springframework.security:spring-security-config'
    api 'io.jsonwebtoken:jjwt-api:0.12.6'

    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.3.5'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            name = 'AzureArtifacts'
            url = uri(System.getenv('AZURE_ARTIFACTS_FEED_URL') ?: 
                    'https://pkgs.dev.azure.com/eduardoleite0637/ai/_packaging/ArquiteturaBauCapitao/maven/v1')
            credentials {
                username = System.getenv('AZURE_ARTIFACTS_USERNAME') ?: 'AzureDevOps'
                password = System.getenv('AZURE_ARTIFACTS_TOKEN')
            }
        }
    }
}
